name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  conventions:
    uses: vexouLuna/conventions/.github/workflows/conventions-check.yml@v2.1.1
    secrets: inherit

  ci:
    uses: vexouLuna/conventions/.github/workflows/node-ci.yml@v2.1.1
    with:
      # The vex libraries are git dependencies, built by their `prepare` script on install.
      ignore-scripts: false
