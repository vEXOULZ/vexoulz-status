name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  conventions:
    uses: vEXOULZ/conventions/.github/workflows/conventions-check.yml@v1.0.0
    secrets: inherit

  ci:
    uses: vEXOULZ/conventions/.github/workflows/node-ci.yml@v1.0.0
    with:
      # The vexoulz libraries are git dependencies, built by their `prepare` script on install.
      ignore-scripts: false
